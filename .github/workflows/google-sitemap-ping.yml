# Stermont Arcade - tells Google to re-read the sitemaps.
# Schedule (recommended practice - Google only needs a nudge when a sitemap actually changed):
#   - once a day at 04:30 UTC, always
#   - after a "Build product pages" run, ONLY if a sitemap file changed since the last successful ping,
#     and at most once every COOLDOWN_HOURS (3) hours
#   - on demand (Run workflow) and when this script or workflow changes
# Before this change every 30-minute rebuild re-submitted all 5 sitemaps (about 20 pings an hour) even when nothing had changed.
# Needs the GSC_SERVICE_ACCOUNT_JSON and GSC_PROPERTY secrets (see seo-google-sitemaps.mjs). Does nothing until they are added.
name: Google sitemap ping

on:
  push:
    branches: [main]
    paths:
      - 'seo-google-sitemaps.mjs'
      - '.github/workflows/google-sitemap-ping.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
    # Catch-up: sends a sitemap change that was skipped by the cooldown. Skips when nothing changed.
    - cron: '50 */3 * * *'
  workflow_run:
    workflows: ['Build product pages']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Decide whether Google needs a ping
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          BUILD_RESULT: ${{ github.event.workflow_run.conclusion }}
          COOLDOWN_HOURS: '3'
        run: |
          if [ "$EVENT" != "workflow_run" ] && [ "$SCHEDULE" != "50 */3 * * *" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "Daily, manual or code-change run - pinging Google."
            exit 0
          fi
          skip() { echo "go=false" >> "$GITHUB_OUTPUT"; echo "Skipping ping: $1"; exit 0; }
          [ "$EVENT" != "workflow_run" ] || [ "$BUILD_RESULT" = "success" ] || skip "the page build did not succeed."
          # A run that skips the ping still ends in "success", so look for the last run whose submit step really ran.
          last=""
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/google-sitemap-ping.yml/runs?status=success&per_page=60" --jq '.workflow_runs[] | "\(.id),\(.created_at)"' || true)
          for run in $runs; do
            sent=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run%,*}/jobs" --jq '[.jobs[].steps[] | select(.name == "Submit sitemaps to Google Search Console" and .conclusion == "success")] | length' || echo 0)
            if [ "${sent:-0}" -gt 0 ]; then last=${run#*,}; break; fi
          done
          if [ -n "$last" ]; then
            age=$(( $(date +%s) - $(date -d "$last" +%s) ))
            [ "$age" -ge $(( COOLDOWN_HOURS * 3600 )) ] || skip "last successful ping was only $(( age / 60 )) minutes ago (cooldown ${COOLDOWN_HOURS}h)."
            since="$last"
          else
            since="24 hours ago"
          fi
          changed=$(git log --since="$since" --format=%h -n 1 -- '*sitemap*.xml')
          [ -n "$changed" ] || skip "no sitemap changed since the last ping."
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "Sitemap changed since $since (commit $changed) - pinging Google."
      - name: Wait for GitHub Pages to publish
        if: steps.gate.outputs.go == 'true'
        run: sleep 120
      - name: Submit sitemaps to Google Search Console
        if: steps.gate.outputs.go == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
        run: node seo-google-sitemaps.mjs
      - name: Store Google sitemap submission results in Neon
        if: always() && steps.gate.outputs.go == 'true' && hashFiles('google-sitemap-results.json') != ''
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          npm install --no-save @neondatabase/serverless
          node neon-automation-sync.mjs sitemap

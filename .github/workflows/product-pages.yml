# Stermont Arcade - rebuilds every product page, category page and the product sitemap automatically.
# Runs: every 30 minutes, when generate-products.mjs changes, on a repository_dispatch event of type catalog-changed (instant rebuild), and whenever you tap "Run workflow" in the Actions tab.
# Why every 30 minutes: a product only has a /p/ page after a build, so a product activated between builds had a dead link until the next one (2026-11-06, Agrimec 018EC). 404.html now opens such links in the shop meanwhile, and check-product-pages.mjs fails the run if an active product is still missing a page.
# Safety: catalogue-count-guard.mjs stops the build when the live catalogue is almost empty (for example while products are hidden during a database quota pause), because the build deletes every old page before it writes the new ones.
name: Build product pages

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      allow_small_catalogue:
        description: 'Type 1 only if the catalogue is intentionally small (turns off the empty-catalogue guard)'
        required: false
        default: ''
  repository_dispatch:
    types: [catalog-changed]
  push:
    branches: [main]
    paths:
      - 'generate-products.mjs'
      - 'neon-admin.html'
      - 'product-slug.mjs'
      - 'product-links.js'
      - 'product-url-policy.test.mjs'
      - 'catalogue-count-guard.mjs'
      - 'catalogue-count-guard.test.mjs'
      - 'mobile-shell/app.js'
      - 'mobile-shell/description.test.mjs'
      - 'product-description-html.mjs'
      - 'product-description-html.test.mjs'
      - 'product-page-design.test.mjs'
      - 'seo-description-layout.mjs'
      - 'seo-indexing-guard.test.mjs'
      - 'category-hubs.mjs'
      - 'category-hubs.test.mjs'
      - 'seo-catalog-guard.mjs'
      - 'seo-catalog-guard.test.mjs'
      - 'seo-product-identifiers.mjs'
      - 'seo-product-identifiers.test.mjs'
      - 'product-codes.test.mjs'
      - 'seo-product-extras.mjs'
      - 'seo-meta.mjs'
      - 'seo-safe-meta.mjs'
      - 'seo-safe-meta.test.mjs'
      - 'seo-overrides.mjs'
      - 'seo-overrides.json'
      - 'seo-titles.mjs'
      - 'seo-titles.test.mjs'
      - 'seo-shell-redirect.mjs'
      - 'seo-shell-redirect.test.mjs'
      - 'seo-shell-chrome.mjs'
      - 'seo-shell-chrome.test.mjs'
      - 'shell-chrome.js'
      - 'seo-related-fill.mjs'
      - 'product-content.json'
      - 'product-content.test.mjs'
      - 'seo-kenya.mjs'
      - 'category-link-normalizer.mjs'
      - 'category-parent-map.json'
      - 'blog-build.mjs'
      - 'seo-blog-titles.mjs'
      - 'seo-safe-blog-meta.mjs'
      - 'seo-safe-blog-meta.test.mjs'
      - 'link-check.mjs'
      - 'product-link-normalizer.mjs'
      - '404.html'
      - 'check-product-pages.mjs'
      - 'check-product-pages.test.mjs'
      - 'not-found-fallback.test.mjs'
      - '.github/workflows/product-pages.yml'

permissions:
  contents: write

concurrency:
  group: product-pages-v3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the site files
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Test parent category hub aggregation
        run: node category-hubs.test.mjs

      - name: Test Google indexing safeguards (canonical, robots and sitemap)
        run: node seo-indexing-guard.test.mjs

      - name: Test canonical product URLs, Product JSON-LD and new-product slug policy
        run: node product-url-policy.test.mjs

      - name: Test validated optional GTIN/MPN Product schema fields
        run: node seo-product-identifiers.test.mjs

      - name: Test unique product codes on pages and in admin
        run: node product-codes.test.mjs

      - name: Test shared SEO metadata rules
        run: node seo-meta.test.mjs

      - name: Test active catalogue SEO metadata quality guard
        run: node seo-catalog-guard.test.mjs

      - name: Test the empty-catalogue guard
        run: node catalogue-count-guard.test.mjs

      - name: Guard - refuse to rebuild from an almost empty catalogue
        env:
          ALLOW_SMALL_CATALOGUE: ${{ github.event.inputs.allow_small_catalogue }}
        run: node catalogue-count-guard.mjs

      - name: Audit active catalogue before page generation
        run: node seo-catalog-guard.mjs

      - name: Test allowlisted ordinary-product meta descriptions
        run: node seo-safe-meta.test.mjs

      - name: Test hand-written product content
        run: node product-content.test.mjs

      - name: Test the 404 page fallback (unbuilt product and category links open in the shop)
        run: node not-found-fallback.test.mjs

      - name: Test product description section rendering
        run: node product-description-html.test.mjs

      - name: Test modern responsive product-page design
        run: node product-page-design.test.mjs

      - name: Test the product page guard
        run: node check-product-pages.test.mjs

      - name: Test homepage server-rendered product cards
        run: node home-grid-ssr.test.mjs

      - name: Build pages and sitemap from the live catalog
        run: node generate-products.mjs

      - name: Kenya SEO titles, descriptions and price guides (seo-kenya.mjs)
        continue-on-error: true
        run: node seo-kenya.mjs

      - name: Rebuild blog pages and normalize their category links
        run: |
          node seo-safe-blog-meta.test.mjs
          node seo-blog-titles.mjs
          node seo-safe-blog-meta.mjs
          node blog-build.mjs

      - name: Normalize internal category links in generated product pages
        run: node category-link-normalizer.mjs

      - name: Normalize visible product links in generated pages
        run: node product-link-normalizer.mjs

      - name: Apply Google titles, descriptions and FAQs (seo-overrides.json)
        run: node seo-overrides.mjs

      - name: Apply allowlisted ordinary-product meta descriptions only
        run: node seo-safe-meta.mjs

      - name: Marketplace-style product description layout - tabs, spec table, tick list (seo-description-layout.mjs)
        continue-on-error: true
        run: node seo-description-layout.mjs

      - name: Top up related-product links on pages in small categories (seo-related-fill.mjs)
        continue-on-error: true
        run: node seo-related-fill.mjs

      - name: Test canonical responsive product-page routing and legacy redirect removal
        run: node seo-shell-chrome.test.mjs

      - name: Test full mobile-shell routing for product and category URLs
        run: node seo-shell-redirect.test.mjs

      - name: Route product and category pages into the full mobile shell
        run: node seo-shell-redirect.mjs

      - name: Speed - connect to the shop database early (preconnect)
        run: |
          # Remove the obsolete Supabase hint and ensure the live Neon REST endpoint is preconnected.
          sed -i '/<link rel="preconnect" href="https:\/\/oewvtbnmyombbtggamor\.supabase\.co" crossorigin>/d' index.html
          if ! grep -q 'rel="preconnect" href="https://ep-dry-butterfly-bhytt90y.apirest.c-10.eu-central-1.aws.neon.tech"' index.html; then
            sed -i '0,/<meta charset="UTF-8">/s##&\n  <link rel="preconnect" href="https://ep-dry-butterfly-bhytt90y.apirest.c-10.eu-central-1.aws.neon.tech" crossorigin>#' index.html
          fi

      - name: Warn about broken or placeholder links before saving (link-check.mjs)
        continue-on-error: true
        run: node link-check.mjs --warn

      - name: Save changes (only if something changed)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A p c guides blog services pest-control checkout.html sitemap-products.xml sitemap-state.json sitemap.xml robots.txt products.html merchant-feed.xml product-names.json index.html fashion.html cars-for-sale.html
          if git diff --cached --quiet; then
            echo "Nothing changed - no commit needed."
          else
            git commit -m "Update product pages and sitemap"
            # Another automation or maintainer may update main while this build is running.
            # Fetch/rebase and retry a rejected push instead of losing this generated update.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                # Concurrent catalogue builds may both regenerate the same product HTML.
                # During rebase, --theirs is this run's freshly generated catalogue output.
                conflicts="$(git diff --name-only --diff-filter=U)"
                if [ -z "$conflicts" ]; then
                  echo "::error::Rebase failed without resolvable generated-page conflicts."
                  exit 1
                fi
                while IFS= read -r path; do
                  case "$path" in
                    p/*.html|c/*.html|guides/*.html|blog/*.html|services/*.html|pest-control/*.html|checkout.html|products.html|sitemap-products.xml|sitemap-state.json|sitemap.xml|robots.txt|merchant-feed.xml|product-names.json|index.html|fashion.html|cars-for-sale.html)
                      git checkout --theirs -- "$path"
                      git add -- "$path"
                      ;;
                    *)
                      echo "::error::Unexpected source-file conflict: $path"
                      exit 1
                      ;;
                  esac
                done <<< "$conflicts"
                GIT_EDITOR=true git rebase --continue
              fi
              if git push origin HEAD:main; then
                echo "Generated pages and sitemap saved to main."
                exit 0
              fi
              echo "Push attempt ${attempt} was rejected; retrying after fetching the latest main."
              sleep $((attempt * 2))
            done
            echo "::error::Could not publish generated pages after three push attempts."
            exit 1
          fi

      - name: Guard - every active product must have a built page (no dead product links)
        run: node check-product-pages.mjs

      - name: Tell Bing and other search engines about changed pages (IndexNow)
        timeout-minutes: 1
        continue-on-error: true
        run: |
          if [ "$(git log -1 --format=%s)" != "Update product pages and sitemap" ]; then echo "No new commit - nothing to submit."; exit 0; fi
          sleep 10   # allow GitHub Pages a brief head start; submission is best-effort
          git diff --name-only --diff-filter=AMD HEAD~1 HEAD | grep -E '^(p|c|guides)/.*\.html$|^products\.html$' | sed 's#^#https://stermontarcade.co.ke/#' | head -9000 > urls.txt || true
          if [ ! -s urls.txt ]; then echo "No page URLs changed."; exit 0; fi
          python3 - <<'PY'
          import json, urllib.request
          urls = [u.strip() for u in open('urls.txt') if u.strip()]
          body = {"host": "stermontarcade.co.ke", "key": "8f12b16c2962614f0cce8ada60431436", "keyLocation": "https://stermontarcade.co.ke/8f12b16c2962614f0cce8ada60431436.txt", "urlList": urls}
          req = urllib.request.Request("https://api.indexnow.org/indexnow", json.dumps(body).encode(), {"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow response:", urllib.request.urlopen(req, timeout=10).status, "for", len(urls), "URLs")
          except Exception as e:
              print("IndexNow submit failed (not critical):", e)
          PY

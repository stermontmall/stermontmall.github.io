# Stermont Arcade - seo-auto-index. Keeps meta tags and JSON-LD schema standardized on the hand-written pages
# and tells Bing and other IndexNow search engines about every page in the sitemaps.
# Runs: when a page changes, every Monday 09:00 Nairobi time, or whenever you tap "Run workflow" in the Actions tab.
name: SEO auto index

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'analytics.js'
      - 'seo-auto-index.mjs'
      - 'sitemap.xml'

permissions:
  contents: write

concurrency:
  group: seo-auto-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Standardize meta tags and schema
        run: node seo-auto-index.mjs

      - name: Save changes (only if something changed)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -- '*.html' p c blog
          if git diff --cached --quiet; then
            echo "Nothing changed - no commit needed."
          else
            git commit -m "Standardize SEO meta tags and schema"
            git push
            sleep 120   # give GitHub Pages time to publish before search engines visit
          fi

      - name: Submit all sitemap URLs (IndexNow)
        run: node seo-auto-index.mjs --submit

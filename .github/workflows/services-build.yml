name: Build services pages
on:
  push:
    paths:
      - 'services/services-data.json'
      - 'services/services-extra.json'
      - 'services/build-services.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build service pages, guides and sitemap
        run: node services/build-services.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services
          git diff --cached --quiet || (git commit -m "Build services pages" && git pull --rebase origin "$GITHUB_REF_NAME" && git push)

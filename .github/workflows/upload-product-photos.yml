name: Upload product photos to ImageKit

# Used by Claude and ChatGPT when publishing products (Neon rule publish_products, Step 4).
# The only trigger is a push to main that changes data/photo-queue.txt.
# Format: one per line. Each line can be a product PAGE address or a direct image address, with an optional "file-name|" first.
# For a page, the job extracts candidate photos, rejects HTML/non-image downloads, converts valid raster input to JPEG,
# uploads the JPEG binary to /products/, and verifies HTTP 200 image/jpeg plus minimum 200 x 200. The "browser_url" for each photo is printed in the log and the run summary,
# and the full results are saved to data/photo-results.json on main (RESULTS_JSON), so an assistant can read them without opening the log.
# Needs the repository secret IMAGEKIT_PRIVATE_KEY (ImageKit > Developer options > Private key). It never touches the database.

on:
  push:
    branches: [main]
    paths:
      - 'data/photo-queue.txt'

permissions:
  contents: write

concurrency:
  group: upload-product-photos-jpeg-normalized
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install sharp image conversion library
        run: npm install --no-save --package-lock=false sharp@0.34.3

      - name: Upload photos to ImageKit and verify them as JPEG
        shell: bash
        env:
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
        run: |
          set -o pipefail
          PHOTOS="$(cat data/photo-queue.txt 2>/dev/null || true)"
          export PHOTOS
          if ! printf '%s\n' "$PHOTOS" | grep -qv '^[[:space:]]*\(#.*\)\?$'; then
            echo "Nothing to upload (the queue is empty or only comments)."
            exit 0
          fi
          node scripts/upload-product-photos-to-imagekit.mjs | tee upload.log

      - name: Save results for the assistant
        if: always() && github.ref == 'refs/heads/main' && hashFiles('upload.log') != ''
        continue-on-error: true
        shell: bash
        run: |
          RESULTS_TMP="$(mktemp)"
          awk 'BEGIN { capture=0 } /^RESULTS_JSON_BEGIN$/ { capture=1; next } /^RESULTS_JSON_END$/ { capture=0; exit } capture { print }' upload.log > "$RESULTS_TMP" || true
          if [ -s "$RESULTS_TMP" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Rebase conflicts used to lose concurrent queue-run results. Rebase from the
            # latest main on every retry, then restore this run's complete result payload.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              cp "$RESULTS_TMP" data/photo-results.json
              git add data/photo-results.json
              if git diff --cached --quiet; then
                echo "Photo results already match main."
                exit 0
              fi
              git commit -m "Record photo upload results"
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another main update; retrying ($attempt/5)."
            done
            echo "::error::Could not save photo results after five attempts."
            exit 1
          fi

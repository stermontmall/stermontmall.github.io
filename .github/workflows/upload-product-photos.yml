name: Upload product photos to ImageKit

# Used by the V8 publishing workflow.
# The only trigger is a push to main that changes data/photo-queue.txt.
# Queue lines may contain a product page URL or a direct image URL, with an optional "file-name|" prefix.
# Product pages are inspected for matching product images; valid raster images are normalized to JPEG and verified on ImageKit.
# Results are saved to data/photo-results.json. The workflow never changes Neon.
on:
  push:
    branches: [main]
    paths:
      - 'data/photo-queue.txt'

permissions:
  contents: write

concurrency:
  group: upload-product-photos-jpeg-normalized
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install sharp image conversion library
        run: npm install --no-save --package-lock=false sharp@0.34.3

      - name: Upload photos to ImageKit and verify them as JPEG
        shell: bash
        env:
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
        run: |
          set -o pipefail
          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            PHOTOS="$(cat data/photo-queue.txt 2>/dev/null || true)"
          else
            # The photo queue is append-only; process only lines added by this push.
            PHOTOS="$(git diff --no-ext-diff --unified=0 "$BEFORE" "$GITHUB_SHA" -- data/photo-queue.txt | awk '/^\+\+\+/{next} /^\+/{sub(/^\+/, ""); print}')"
          fi
          export PHOTOS
          if [[ -z "$(printf '%s\n' "$PHOTOS" | sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d')" ]]; then
            echo "No new photo queue entries were added by this push."
            exit 0
          fi
          node scripts/upload-product-photos-to-imagekit.mjs | tee upload.log

      - name: Save results for the assistant
        if: always() && github.ref == 'refs/heads/main' && hashFiles('upload.log') != ''
        continue-on-error: true
        shell: bash
        run: |
          RESULTS_TMP="$(mktemp)"
          if [ -f data/photo-results.json ]; then cp data/photo-results.json "$RESULTS_TMP"; fi
          if [ -s "$RESULTS_TMP" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              cp "$RESULTS_TMP" data/photo-results.json
              git add data/photo-results.json
              if git diff --cached --quiet; then
                echo "Photo results already match main."
                exit 0
              fi
              git commit -m "Record photo upload results"
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another main update; retrying ($attempt/5)."
            done
            echo "::error::Could not save photo results after five attempts."
            exit 1
          fi

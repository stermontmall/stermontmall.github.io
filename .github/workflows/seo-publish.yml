# Stermont Arcade - publishes admin-APPROVED SEO proposals to the live site automatically.
# Flow: admin > SEO Doctor > "Approve draft" (status approved)  ->  this workflow (every 30 minutes) ->
#       edits the page's SEO title + meta description, rebuilds blog index/sitemap, re-runs the site audit,
#       commits to main, waits for GitHub Pages, checks the live page + sitemap, then saves published/failed in Supabase.
# A proposal that is cut off, generic, duplicate, on a generated page, or that would make the audit worse is NOT published:
# it is saved as "failed" with the reason in publish_error (shown in the admin SEO Doctor).
# Needs the existing repository secrets SUPABASE_URL and SUPABASE_SERVICE_KEY. Rules and tests: seo-publish.mjs, seo-publish.test.mjs.
# Run by hand: Actions > "Publish approved SEO proposals" > Run workflow (tick "Dry run" to see what would happen and change nothing).
name: Publish approved SEO proposals

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: show what would be published, change nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seo-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run the publisher tests
        run: node seo-publish.test.mjs

      - name: Site audit before publishing
        run: node seo-check.mjs > seo-before.md

      - name: Plan - read approved proposals and edit the pages
        id: plan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          node seo-publish.mjs plan | tee seo-publish-plan.txt

      - name: Rebuild blog titles, index and sitemap
        if: steps.plan.outputs.changed != '0'
        run: |
          node seo-blog-titles.mjs
          node blog-build.mjs

      - name: Site audit after publishing (must not be worse)
        id: gate
        if: steps.plan.outputs.changed != '0'
        run: |
          node seo-check.mjs > seo-after.md
          if ! node seo-publish.mjs gate seo-before.md seo-after.md; then
            git checkout -- .
            echo "reverted=true" >> "$GITHUB_OUTPUT"
            echo "The audit got worse, so every edit was reverted."
          fi

      - name: Commit and push to main
        id: push
        if: steps.plan.outputs.changed != '0' && steps.gate.outputs.reverted != 'true' && inputs.dry_run != true
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Publish approved SEO titles and descriptions (${{ steps.plan.outputs.changed }} page(s))"
            git pull --rebase -q origin main
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the live site (page, title, description, sitemap date)
        if: steps.push.outputs.pushed == 'true'
        run: node seo-publish.mjs verify

      - name: Save published / failed in Supabase
        if: steps.plan.outputs.waiting != '0' && inputs.dry_run != true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node seo-publish.mjs finalize

      - name: Summary
        if: always()
        run: |
          {
            echo "### Publish approved SEO proposals"
            echo "Dry run: ${{ inputs.dry_run == true }}"
            echo '```'
            cat seo-publish-plan.txt 2>/dev/null || echo "No plan was produced."
            echo '```'
            [ -f seo-after.md ] && { echo "Site audit after:"; head -5 seo-after.md; }
          } >> "$GITHUB_STEP_SUMMARY"

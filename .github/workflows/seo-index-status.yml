# Stermont Arcade - asks Google which of your pages are indexed, and why the rest are not.
# Runs every 3 hours (8 runs a day). Each run checks a DIFFERENT batch of 150 pages (ROTATE_HOURS=3),
# so 8 x 150 = 1,200 inspections a day - under Google's limit of about 2,000 per property per day - and the whole catalogue gets covered faster.
# Every run is saved to Neon, and every run reports how many PRODUCTS are indexed in total (cumulative across all batches):
#   - Neon: seo_audits.metrics (products_indexed / products_total) and the view public.product_index_summary
#   - GitHub: the run summary page of every run, plus the title of the daily issue
# A GitHub Issue (GitHub emails you) is opened once a day (the morning run) or whenever you tap "Run workflow".
# Do not raise MAX_URLS above 200 or add more runs per day: running after every page rebuild once used up Google's daily URL Inspection quota.
# Needs the GSC_SERVICE_ACCOUNT_JSON and GSC_PROPERTY secrets (same ones as the sitemap ping) and NEON_DATABASE_URL.
name: Google indexing status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-index-status.yml'
      - 'seo-index-status.mjs'
      - 'neon-automation-sync.mjs'
  workflow_dispatch:
  schedule:
    - cron: '30 1,4,7,10,13,16,19,22 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: google-index-status
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check every page with Google
        id: inspect
        continue-on-error: true
        timeout-minutes: 25
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
          MAX_MINUTES: '20'
          MAX_URLS: '150'
          ROTATE_HOURS: '3'
        run: node seo-index-status.mjs > index-status.md
      - name: Install Neon driver
        run: npm install --no-save @neondatabase/serverless
      - name: Store Google indexing report in Neon
        id: neon
        if: always() && hashFiles('index-results.json') != ''
        continue-on-error: true
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: node neon-automation-sync.mjs index
      - name: Count products indexed so far (from Neon)
        id: totals
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          node neon-automation-sync.mjs totals
          cat index-totals.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish as an issue (morning run or manual run only)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          hour=$(date -u +%H)
          if [ "$EVENT" = "schedule" ] && { [ "$hour" -lt 7 ] || [ "$hour" -ge 10 ]; }; then
            echo "Not the morning run - report saved to Neon only, no issue opened."
            exit 0
          fi
          headline=""
          if [ -f index-headline.txt ]; then headline=" - $(cat index-headline.txt)"; fi
          { if [ -f index-totals.md ]; then cat index-totals.md; echo; fi; cat index-status.md; } > issue-body.md
          for n in $(gh issue list --state open --search "Google indexing status in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded by the newer report." || true
          done
          gh issue create --title "Google indexing status $(date +%F)$headline" --body-file issue-body.md
      - name: Mark incomplete inspection as failed
        if: steps.inspect.outcome == 'failure' || steps.neon.outcome == 'failure' || steps.totals.outcome == 'failure'
        run: exit 1

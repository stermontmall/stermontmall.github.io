# Stermont Arcade - asks Google which of your pages are indexed, and why the rest are not.
# Opens a GitHub Issue (GitHub emails you) every day after the product pages rebuild, or whenever you tap "Run workflow" in the Actions tab.
# Needs the GSC_SERVICE_ACCOUNT_JSON and GSC_PROPERTY secrets (same ones as the sitemap ping).
name: Google indexing status

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'
  workflow_run:
    workflows: ['Build product pages']
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check every page with Google
        id: inspect
        continue-on-error: true
        timeout-minutes: 25
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
          MAX_MINUTES: '20'
        run: node seo-index-status.mjs > index-status.md
      - name: Publish as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "Google indexing status in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded by the newer report." || true
          done
          gh issue create --title "Google indexing status $(date +%F)" --body-file index-status.md
      - name: Mark incomplete inspection as failed
        if: steps.inspect.outcome == 'failure'
        run: exit 1

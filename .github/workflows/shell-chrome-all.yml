name: Shell look on static pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shell-chrome-all
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Add the shell top bar and bottom nav
        run: node seo-shell-chrome-all.mjs
      - name: Save changes (only if something changed)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A pest-control nairobi.html bulk-quote.html 404.html
          if git diff --cached --quiet; then
            echo "Nothing changed - no commit needed."
          else
            git commit -m "Shell look on static pages"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

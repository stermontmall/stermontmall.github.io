name: Deploy Neon photo upload function

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type DEPLOY to deploy photoupload to the Stermont main Neon branch'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-photoupload-main
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Neon CLI and function dependencies
        run: |
          npm install --global neon@latest
          npm install --prefix neon-functions/photoupload --omit=dev

      - name: Deploy bundled function to Neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: restless-shape-79120240
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "::error::Repository secret NEON_API_KEY is not configured."
            exit 1
          fi
          neon functions deploy photoupload \
            --src neon-functions/photoupload \
            --branch br-fancy-bird-bh01xcbs \
            --wait

      - name: Verify deployment status
        run: neon functions get photoupload --branch br-fancy-bird-bh01xcbs

# Stermont Arcade - daily SEO + content-quality health check.
# Opens a GitHub Issue with the problems found (GitHub emails you).
# Runs every day 09:00 Nairobi time, or whenever you tap "Run workflow" in Actions.
name: Daily SEO check

on:
  push:
    branches: [main]
    paths:
      - 'seo-meta.mjs'
      - 'seo-meta.test.mjs'
      - 'seo-check.mjs'
      - 'seo-doctor.js'
      - 'seo-content-doctor.mjs'
      - 'seo-content-doctor.test.mjs'
      - 'generate-products.mjs'
      - 'blog/**'
      - 'guides/**'
      - 'services/**'
      - '*.html'
      - '.github/workflows/seo-daily.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Test shared SEO metadata rules
        run: node seo-meta.test.mjs
      - name: Test Content Doctor rules and Admin SEO Doctor syntax
        run: node seo-content-doctor.test.mjs
      - name: Run technical SEO check
        run: node seo-check.mjs > seo-report.md
      - name: Run content-quality Doctor
        run: node seo-content-doctor.mjs > seo-content-report.md
      - name: Combine reports
        run: |
          {
            cat seo-report.md
            printf '\n\n---\n\n'
            cat seo-content-report.md
          } > seo-report-combined.md
      - name: Publish the report as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "SEO check in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded by today's report." || true
          done
          gh issue create --title "Daily SEO check $(date +%F)" --body-file seo-report-combined.md

# Stermont Arcade - daily SEO + content-quality health check.
# Opens a GitHub Issue with the problems found (GitHub emails you).
# Runs every day 09:00 Nairobi time, or whenever you tap "Run workflow" in Actions.
name: Daily SEO check

on:
  push:
    branches: [main]
    paths:
      - 'seo-meta.mjs'
      - 'seo-meta.test.mjs'
      - 'seo-check.mjs'
      - 'seo-description-check.mjs'
      - 'seo-description-check.test.mjs'
      - 'generate-products.mjs'
      - 'p/**'
      - 'c/**'
      - 'products.html'
      - 'sitemap*.xml'
      - 'blog/**'
      - 'guides/**'
      - 'services/**'
      - 'pest-control/**'
      - '*.html'
      - '.github/workflows/seo-daily.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Test shared SEO metadata rules
        run: node seo-meta.test.mjs
      - name: Test product description extraction against current and legacy layouts
        run: node seo-description-check.test.mjs
      # Build the same catalogue output that customers and Google see before auditing it.
      # Without this step, generated root-level category pages and current database SEO overrides
      # are absent from the checkout, creating false missing-sitemap and duplicate-metadata alerts.
      - name: Build product and category pages from the live catalogue
        run: node generate-products.mjs
      - name: Apply Kenya category titles, descriptions and guides
        continue-on-error: true
        run: node seo-kenya.mjs
      - name: Apply approved SEO overrides
        run: node seo-overrides.mjs
      - name: Apply owner-approved product titles
        continue-on-error: true
        run: node seo-titles.mjs
      - name: Apply allowlisted product meta descriptions
        run: node seo-safe-meta.mjs
      - name: Apply product description layout
        continue-on-error: true
        run: node seo-description-layout.mjs
      - name: Fill related product links
        continue-on-error: true
        run: node seo-related-fill.mjs
      - name: Apply crawler and phone routing rules
        continue-on-error: true
        run: node seo-shell-redirect.mjs
      - name: Run technical SEO check against generated output
        run: node seo-check.mjs > seo-report.md
      - name: Publish the report as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "SEO check in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded by today's report." || true
          done
          gh issue create --title "Daily technical SEO check $(date +%F)" --body-file seo-report.md

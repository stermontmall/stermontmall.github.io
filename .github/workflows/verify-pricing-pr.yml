name: Verify pricing catalogue PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: verify-pricing-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-pricing:
    if: github.event.pull_request.head.ref == 'pricing/non-syngenta-market-review-20261117' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch main baseline
        run: |
          git fetch --no-tags origin main
          git show df17473e0701363312387b6fac6ef336788c9299:sitemap.xml > /tmp/main-sitemap.xml
          mkdir -p /tmp/main-pages
          git archive df17473e0701363312387b6fac6ef336788c9299 p | tar -x -C /tmp/main-pages

      - name: Generate product pages and sitemaps
        run: node generate-products.mjs

      - name: Verify all 230 affected product pages and sitemap
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          const fail = message => { console.error('FAIL:', message); process.exitCode = 1; };
          const pass = message => console.log('PASS:', message);
          const sqlDir = 'supabase/sql';
          const sqlFiles = fs.readdirSync(sqlDir).filter(name => /^pricing-batch-\d+\.sql$/.test(name));
          const updatedIds = new Set();
          const insertedIds = new Set();

          for (const name of sqlFiles) {
            const sql = fs.readFileSync(path.join(sqlDir, name), 'utf8');
            // Guarded price rows use (product_id, expected_price, new_price[, new_cost]).
            for (const match of sql.matchAll(/\('([^']+)',\s*[\d.]+::numeric,\s*[\d.]+::numeric/g)) {
              updatedIds.add(match[1]);
            }
            // Each new pack is a single-row INSERT with its product id as the first value.
            for (const match of sql.matchAll(/insert\s+into\s+public\.products[\s\S]*?values\s*\(\s*'([^']+)'/gi)) {
              insertedIds.add(match[1]);
            }
          }

          if (updatedIds.size !== 205) fail(`Expected 205 unique repriced product IDs; found ${updatedIds.size}`);
          else pass('205 unique existing product IDs extracted from guarded pricing SQL');
          if (insertedIds.size !== 25) fail(`Expected 25 new pack IDs; found ${insertedIds.size}`);
          else pass('25 new pack IDs extracted from product INSERT SQL');

          const overlap = [...updatedIds].filter(id => insertedIds.has(id));
          if (overlap.length) fail(`IDs appear as both updates and inserts: ${overlap.join(', ')}`);

          const htmlFiles = fs.readdirSync('p').filter(name => name.endsWith('.html'));
          const productsBySku = new Map();
          for (const file of htmlFiles) {
            const html = fs.readFileSync(path.join('p', file), 'utf8');
            const scripts = [...html.matchAll(/<script\s+type="application\/ld\+json">([\s\S]*?)<\/script>/gi)];
            for (const script of scripts) {
              try {
                const data = JSON.parse(script[1]);
                const candidates = Array.isArray(data) ? data : [data];
                for (const item of candidates) {
                  if (item?.['@type'] === 'Product' && item.sku) {
                    productsBySku.set(String(item.sku), { product: item, file });
                  }
                  if (item?.['@type'] === 'ProductGroup' && Array.isArray(item.hasVariant)) {
                    for (const variant of item.hasVariant) {
                      if (variant?.['@type'] === 'Product' && variant.sku) {
                        productsBySku.set(String(variant.sku), { product: variant, file });
                      }
                    }
                  }
                }
              } catch {}
            }
          }

          const expectedIds = [...updatedIds, ...insertedIds];
          if (expectedIds.length !== 230) fail(`Expected 230 total affected IDs; found ${expectedIds.length}`);
          let cleanProducts = 0;
          const affectedCanonicalUrls = new Set();
          const expectedValidity = new Date();
          expectedValidity.setUTCFullYear(expectedValidity.getUTCFullYear() + 1);
          const expectedValidityDate = expectedValidity.toISOString().slice(0, 10);

          for (const id of expectedIds) {
            const found = productsBySku.get(id);
            if (!found) { fail(`Missing generated Product JSON-LD for product ID ${id}`); continue; }
            const product = found.product;
            const offer = Array.isArray(product.offers) ? product.offers[0] : product.offers;
            if (!offer || offer.priceCurrency !== 'KES') { fail(`Wrong/missing KES Offer currency for ${id}`); continue; }
            if (typeof offer.price !== 'number' || !Number.isFinite(offer.price) || offer.price <= 0) { fail(`Offer price is not a positive JSON number for ${id}`); continue; }
            if (offer.availability !== 'https://schema.org/InStock') { fail(`Offer is not InStock for ${id}`); continue; }
            if (offer.priceValidUntil !== expectedValidityDate) { fail(`priceValidUntil for ${id} is ${offer.priceValidUntil}; expected ${expectedValidityDate}`); continue; }
            if (!offer.url) { fail(`Missing Offer URL for ${id}`); continue; }
            const canonical = new URL(offer.url);
            canonical.hash = '';
            affectedCanonicalUrls.add(canonical.href);
            cleanProducts++;
          }
          if (cleanProducts === 230 && process.exitCode !== 1) pass('All 230 affected products have valid Product JSON-LD offers: KES, numeric price, InStock and one-year validity');
          else fail(`Only ${cleanProducts}/230 affected products passed schema checks`);

          const site = 'https://stermontarcade.co.ke';
          const parseSitemap = xml => new Map([...xml.matchAll(/<url>[\s\S]*?<loc>([^<]+)<\/loc>[\s\S]*?<lastmod>([^<]+)<\/lastmod>[\s\S]*?<\/url>/g)].map(m => [m[1], m[2]]));
          const oldXml = fs.readFileSync('/tmp/main-sitemap.xml', 'utf8');
          const newXml = fs.readFileSync('sitemap.xml', 'utf8');
          const oldMap = parseSitemap(oldXml);
          const newMap = parseSitemap(newXml);
          if (!newMap.size) fail('Generated sitemap.xml contains no URL/lastmod entries');

          const missingOld = [...oldMap.keys()].filter(url => !newMap.has(url));
          if (missingOld.length) fail(`${missingOld.length} existing pre-pricing baseline sitemap URLs disappeared: ${missingOld.slice(0, 10).join(', ')}`);
          else pass(`All ${oldMap.size} existing main sitemap URLs remain present`);

          const missingAffected = [...affectedCanonicalUrls].filter(url => !newMap.has(url));
          if (missingAffected.length) fail(`${missingAffected.length} affected canonical product URLs are absent from sitemap.xml: ${missingAffected.slice(0, 10).join(', ')}`);
          else pass(`All ${affectedCanonicalUrls.size} affected canonical product URLs are in sitemap.xml`);

          const today = new Date().toISOString().slice(0, 10);
          let lastmodErrors = 0;
          for (const [url, lastmod] of newMap) {
            const previous = oldMap.get(url);
            const pathname = new URL(url).pathname.replace(/^\/+/, '');
            const isProductPage = pathname.startsWith('p/');
            if (isProductPage && affectedCanonicalUrls.has(url)) {
              const baselineFile = path.join('/tmp/main-pages', pathname);
              const currentFile = path.join('.', pathname);
              const existsNow = fs.existsSync(currentFile);
              const existedBefore = fs.existsSync(baselineFile);
              const changed = existsNow && (!existedBefore || !fs.readFileSync(currentFile).equals(fs.readFileSync(baselineFile)));
              if (changed && previous && lastmod === previous) {
                fail(`Changed product HTML did not receive a new lastmod: ${url}`); lastmodErrors++;
              } else if (!changed && previous && lastmod !== previous) {
                fail(`Unchanged product HTML has a modified lastmod: ${url}`); lastmodErrors++;
              } else if (changed && !previous && lastmod !== today) {
                fail(`New product URL has unexpected lastmod ${lastmod}: ${url}`); lastmodErrors++;
              }
            } else if (previous && lastmod !== previous) {
              fail(`Non-product URL lastmod changed unexpectedly: ${url}`); lastmodErrors++;
            }
          }
          if (!lastmodErrors) pass('sitemap.xml lastmod matches actual product HTML changes; unchanged product and static URLs retain prior dates');

          const newPackMissing = [...insertedIds].filter(id => !productsBySku.has(id));
          if (newPackMissing.length) fail(`Missing new pack Product schema entries: ${newPackMissing.join(', ')}`);
          else pass('All 25 new pack variants are represented in Product/hasVariant JSON-LD and their canonical product pages are sitemap-listed');

          if (process.exitCode === 1) process.exit(1);
          console.log('SUMMARY: PASS — all 230 affected product pages and sitemap checks are clean.');
          NODE

      - name: Write verification summary
        if: success()
        run: |
          {
            echo "## Pricing PR verification: PASS"
            echo "- 205 existing product pages checked"
            echo "- 25 new pack pages checked"
            echo "- 230 valid Product JSON-LD offers: KES, numeric price, InStock, one-year priceValidUntil"
            echo "- All pre-pricing baseline sitemap URLs preserved"
            echo "- All 25 new pack URLs included"
            echo "- sitemap.xml lastmod matches actual HTML changes only"
            echo ""
            echo "This workflow only builds and verifies. It does not publish, deploy, push, or merge."
          } >> "$GITHUB_STEP_SUMMARY"

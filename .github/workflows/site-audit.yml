# Stermont Arcade - weekly technical checks on general pages and sampled ordinary-retail routes.
# Content optimization remains scoped to ordinary consumer products only.
name: Site audit

on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-audit.yml'
      - '.pa11yci.json'
      - 'seo-analyzer-run.mjs'
      - 'index.html'
      - 'shell-chrome.js'
      - 'kili-pages.js'
      - 'recent-orders.js'
      - 'blog/**'

permissions:
  contents: read

jobs:
  links:
    name: Broken links (Lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --root-dir ${{ github.workspace }}
            --accept 200,201,204,206,301,302,308,403,429
            --exclude 'wa\.me' --exclude 'supabase\.co' --exclude '^mailto:' --exclude '^tel:'
            --max-concurrency 8 --timeout 20 --max-retries 2
            './*.html'
          output: ./lychee-report.md
          fail: true
          jobSummary: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lychee-report
          path: lychee-report.md
          if-no-files-found: ignore

  lighthouse-general-pages:
    name: Performance (sampled site routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Unlighthouse on sampled site routes
        run: npx --yes unlighthouse-ci --site https://stermontarcade.co.ke --build-static --samples 1 --no-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unlighthouse-report
          path: .unlighthouse
          if-no-files-found: ignore

  accessibility:
    name: Accessibility (Pa11y, sampled safe routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Pa11y on sampled safe routes
        run: |
          if npx --yes pa11y-ci --config .pa11yci.json --json > pa11y-report.json; then
            status=0
          else
            status=$?
          fi
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('pa11y-report.json', 'utf8');
            const r = JSON.parse(raw);
            let out = '## Accessibility (Pa11y, WCAG 2 AA)\\n\\n' + r.passes + ' of ' + r.total + ' pages passed.\\n';
            for (const [u, issues] of Object.entries(r.results || {})) if (issues.length) {
              out += '\\n### ' + u + ' (' + issues.length + ')\\n' + issues.slice(0, 8).map(i => '- ' + i.message + ' \`' + (i.selector || '').slice(0, 80) + '\`').join('\\n') + '\\n';
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
            console.log(out);
          "
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa11y-report
          path: pa11y-report.json
          if-no-files-found: ignore

  seo-rules:
    name: On-page technical rules (sampled safe routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install seo-analyzer
        run: npm install --no-save --no-package-lock seo-analyzer
      - name: Run the rules
        run: node seo-analyzer-run.mjs | tee seo-analyzer-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-analyzer-report
          path: seo-analyzer-report.txt
          if-no-files-found: ignore

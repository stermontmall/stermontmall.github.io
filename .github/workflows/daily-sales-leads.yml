# Daily read-only sales and service lead data check.
# This repository is public: never publish customer or business metrics in issues, logs, summaries or artifacts.
name: Daily sales and leads

on:
  schedule:
    - cron: '30 3 * * *' # 06:30 Nairobi (UTC+3)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-sales-leads
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Test privacy and read-only guardrails
        run: node --test sales-leads-report.test.mjs
      - name: Read sales and service lead data privately on this runner
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node sales-leads-report.mjs
      - name: Confirm safe completion without publishing business data
        run: echo "Private sales data check completed. No customer or business metrics were published."

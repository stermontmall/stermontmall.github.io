name: PocketBase adapter compatibility tests

on:
  pull_request:
    paths:
      - 'pocketbase/adapter.js'
      - 'pocketbase/adapter.test.cjs'
      - '.github/workflows/pocketbase-adapter-tests.yml'
  push:
    branches:
      - 'fix/pocketbase-adapter-pagination-tests-2026-11-22'
    paths:
      - 'pocketbase/adapter.js'
      - 'pocketbase/adapter.test.cjs'
      - '.github/workflows/pocketbase-adapter-tests.yml'

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check adapter syntax
        run: node --check pocketbase/adapter.js
      - name: Run adapter compatibility tests
        run: node pocketbase/adapter.test.cjs

# Stermont Arcade - keeps blog/index.html and sitemap.xml in step with the posts in /blog/ automatically.
# Runs: whenever a blog post is added or edited on main, and whenever you tap "Run workflow" in the Actions tab.
name: Build blog index and sitemap

on:
  push:
    branches: [main]
    paths:
      - 'blog/*.html'
      - 'blog-build.mjs'
      - 'seo-blog-titles.mjs'
      - 'seo-safe-blog-meta.mjs'
      - 'seo-safe-blog-meta.test.mjs'
      - 'product-links.js'
      - 'rewrite-static-product-links.mjs'
      - 'no-static-share-links.test.mjs'
      - 'blog-write.mjs'
      - 'seo-pest/blog-build.mjs'
      - 'seo-pest/blogs-*.json'
      - 'p/*.html'
      - 'c/*.html'
      - 'guides/*.html'
      - 'services/*.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the site files
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Rebuild generated product guide articles
        run: |
          for file in seo-pest/blogs-*.json; do
            node seo-pest/blog-build.mjs "$(basename "$file" .json)"
          done
      - name: Migrate legacy customer-facing product links safely
        run: node rewrite-static-product-links.mjs
      - name: Verify customer links and preserved SEO surfaces
        run: node no-static-share-links.test.mjs
      - name: Normalize blog SEO title lengths
        run: node seo-blog-titles.mjs
      - name: Test safe consumer-guide meta descriptions
        run: node seo-safe-blog-meta.test.mjs
      - name: Apply allowlisted safe consumer-guide meta descriptions
        run: node seo-safe-blog-meta.mjs
      - name: Rebuild blog index and sitemap entries
        run: node blog-build.mjs

      - name: Save changes (only if something changed)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add p/*.html c/*.html blog/*.html guides/*.html services/*.html *.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing changed - no commit needed."
          else
            git commit -m "Update blog index and sitemap"
            git push
          fi

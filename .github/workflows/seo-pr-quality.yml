name: SEO pull request quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'seo-*.mjs'
      - 'generate-products.mjs'
      - 'product-links.js'
      - 'rewrite-static-product-links.mjs'
      - 'site-links.js'
      - 'storefront-live.js'
      - 'product-trust.js'
      - 'product-seo-optimizer.js'
      - 'admin-*.js'
      - 'no-static-share-links.test.mjs'
      - '.github/workflows/blog-build.yml'
      - 'services/*.html'
      - 'services/build-services.mjs'
      - 'pest-control/*.html'
      - 'blog-write.mjs'
      - 'seo-pest/blog-build.mjs'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'catalog-v10.js'
      - 'product-codes.test.mjs'
      - 'seo-overrides.json'
      - 'product-description-html.mjs'
      - 'product-description-html.test.mjs'
      - 'home-grid-ssr.mjs'
      - 'home-grid-ssr.test.mjs'
      - 'kili-pages.js'
      - 'cat-feel.js'
      - 'recent-orders.js'
      - 'product-content.json'
      - 'product-content.test.mjs'
      - 'data-health.mjs'
      - 'blog-write.mjs'
      - 'blog-build.mjs'
      - 'blog-topics.json'
      - 'blog/**'
      - 'p/**'
      - 'c/**'
      - 'guides/**'
      - 'services/**'
      - 'pest-control/**'
      - 'link-check.mjs'
      - 'mobile-shell/**'
      - '*.html'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicit bash gives -eo pipefail, so `cmd | tee log` still fails the step when cmd fails.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Every step below tees its output to $RUNNER_TEMP/ci-logs/NN-*.log.
      # If a step fails, every line matching FAIL or Error (with its line number) and the last 80 lines
      # of the newest log are redacted and written to the job summary and an error annotation
      # (see "Report failing step output").
      - name: Prepare failure log directory
        run: mkdir -p "$RUNNER_TEMP/ci-logs"
      - name: Install Playwright Chromium
        run: |
          {
            python -m pip install --upgrade pip playwright
            python -m playwright install --with-deps chromium
          } 2>&1 | tee "$RUNNER_TEMP/ci-logs/01-playwright-install.log"
      # Exercise the mobile shell with harmless fixtures, not live catalogue data.
      # Keep this check alongside the existing product and SEO quality gates.
      # Reset per-test tab state when asserting the default landing view.
      - name: Nothing may go through /classic.html (guard)
        run: node no-classic-hop.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/02-no-classic-hop.log"
      - name: Test server-rendered homepage product cards
        run: node home-grid-ssr.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/03-home-grid-ssr.log"
      - name: Broken and placeholder links (link-check.mjs)
        run: node link-check.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/05-link-check.log"
      - name: Test permanent product-code display and admin integration
        run: node product-codes.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/06-product-codes.log"
      - name: Check JavaScript syntax
        run: |
          {
            node --check category-editorial.mjs
            node --check services/build-services.mjs
            node --check seo-kenya.mjs
            node --check seo-related-fill.mjs
            node --check cat-feel.js
            node --check product-links.js
            node --check rewrite-static-product-links.mjs
            node --check site-links.js
            node --check storefront-live.js
            node --check product-trust.js
            node --check product-seo-optimizer.js
            for f in admin-*.js; do node --check "$f"; done
            node --check product-description-html.mjs
            node --check blog-write.mjs
            node --check seo-pest/blog-build.mjs
            node --check mobile-shell/app.js
            node --check mobile-shell/pp-whatsapp.js
            node --check generate-products.mjs
            node --check seo-shell-redirect.mjs
            node --check seo-shell-redirect.test.mjs
            node --check catalog-v10.js
            node --check product-codes.test.mjs
            node --check seo-check.mjs
            node --check data-health.mjs
            node --check blog-write.mjs
            node --check generate-products.mjs
            node --check kili-pages.js
            node --check recent-orders.js
            node --check product-content.test.mjs
            node --check seo-meta.mjs
          } 2>&1 | tee "$RUNNER_TEMP/ci-logs/07-syntax.log"
      - name: Test category buying introductions and FAQ consistency
        run: node category-editorial.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/07-category-editorial.log"
      - name: Test product description rendering and legacy category-link normalization
        run: node product-description-html.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/08-product-description-html.log"
      - name: Test product category and safety enrichment
        run: node seo-product-extras.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/08-product-extras.log"
      - name: Test product and category SEO metadata
        run: node seo-meta.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/09-seo-meta.log"
      - name: Test allowlisted ordinary-product meta descriptions
        run: node seo-safe-meta.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/10-seo-safe-meta.log"
      - name: Test safe consumer-guide meta descriptions
        run: node seo-safe-blog-meta.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/11-seo-safe-blog-meta.log"
      - name: Test hand-written product content
        run: node product-content.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/12-product-content.log"
      - name: Normalize blog titles and rebuild blog index and sitemap
        run: |
          {
            node seo-blog-titles.mjs
            node blog-build.mjs
            node seo-safe-blog-meta.mjs
          } 2>&1 | tee "$RUNNER_TEMP/ci-logs/13-blog-build.log"
      - name: Build product and category pages from the live public catalogue
        run: node generate-products.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/14-generate-products.log"
      - name: Apply the same SEO enrichment passes used by production
        run: |
          {
            node seo-kenya.mjs
            node seo-related-fill.mjs
            node seo-overrides.mjs
            node seo-titles.mjs
            node seo-safe-meta.mjs
            node seo-shell-redirect.mjs
          } 2>&1 | tee "$RUNNER_TEMP/ci-logs/15-seo-enrichment.log"
      - name: Rebuild generated service pages from their source data
        run: node services/build-services.mjs
      - name: Rebuild generated product guide blog articles
        run: |
          for file in seo-pest/blogs-*.json; do
            node seo-pest/blog-build.mjs "$(basename "$file" .json)"
          done
      - name: Prepare generated product/category fixtures with the production mobile-shell routing
        run: |
          node seo-shell-chrome.mjs
          node seo-shell-redirect.mjs
          node seo-shell-redirect.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/03-shell-route-fixtures.log"
      - name: Run mobile shell browser regression suite
        run: python3 mobile-shell/shell.test.py 2>&1 | tee "$RUNNER_TEMP/ci-logs/04-mobile-shell.log"
      - name: Migrate legacy generated customer product links without changing SEO surfaces
        run: node rewrite-static-product-links.mjs
      - name: Recheck all generated pages for static customer product links
        run: node no-static-share-links.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/15-shell-link-regression.log"
      - name: Run full on-page SEO audit against production-equivalent generated pages
        run: |
          log="$RUNNER_TEMP/ci-logs/16-seo-check.log"
          if ! node seo-check.mjs > seo-pr-report.md 2> "$log"; then
            rc=$?
            cat "$log" >&2
            { echo "--- last 80 lines of seo-pr-report.md ---"; tail -n 80 seo-pr-report.md; } | tee -a "$log"
            exit "$rc"
          fi
      - name: Add audit summary
        if: always()
        run: |
          if [ -f seo-pr-report.md ]; then
            cat seo-pr-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seo-pr-audit-report
          path: seo-pr-report.md
          if-no-files-found: ignore
      - name: Report failing step output
        if: failure()
        env:
          # Present only so the redaction below can strip the token's value if it ever appears in output.
          GH_TOKEN: ${{ github.token }}
        run: |
          log=$(ls "$RUNNER_TEMP"/ci-logs/*.log 2>/dev/null | sort | tail -n 1 || true)
          tail_file="$RUNNER_TEMP/failure-tail.txt"
          hits_file="$RUNNER_TEMP/failure-hits.txt"
          : > "$tail_file"
          : > "$hits_file"
          if [ -n "$log" ] && [ -s "$log" ]; then
            # Every FAIL/Error line (searched in the WHOLE log, so test-server access lines cannot push it out of view)
            # plus the last 80 lines, with ANSI colours removed and secrets/tokens redacted before anything is published.
            python3 - "$log" "$tail_file" "$hits_file" <<'PY'
          import os, re, sys
          src, tail_dst, hits_dst = sys.argv[1], sys.argv[2], sys.argv[3]
          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          lines = [ansi.sub("", l) for l in open(src, errors="replace").read().splitlines()]
          # 1) the literal value of any secret-looking environment variable
          secret_values = [v for n, v in os.environ.items() if len(v) >= 6 and re.search(r"TOKEN|SECRET|PASSWORD|PASSWD|KEY|CREDENTIAL|AUTH|SIGNATURE", n, re.I)]
          # 2) common token shapes and NAME=value / NAME: value assignments
          patterns = [
              (r"gh[pousr]_[A-Za-z0-9]{20,}", "[REDACTED]"),
              (r"github_pat_[A-Za-z0-9_]{20,}", "[REDACTED]"),
              (r"sb_secret_[A-Za-z0-9_-]+", "[REDACTED]"),
              (r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]*", "[REDACTED]"),
              (r"\b(Bearer|Basic)\s+[A-Za-z0-9._~+/=-]+", r"\1 [REDACTED]"),
              (r"((?:TOKEN|SECRET|PASSWORD|PASSWD|API_?KEY|AUTHORIZATION|PRIVATE_?KEY|ACCESS_?KEY)[A-Za-z0-9_]*\s*[=:]\s*)\S+", r"\1[REDACTED]"),
          ]
          def redact(text):
              for value in secret_values:
                  text = text.replace(value, "[REDACTED]")
              for pattern, repl in patterns:
                  text = re.sub(pattern, repl, text, flags=re.I)
              return text
          hits = ["%d: %s" % (i, l) for i, l in enumerate(lines, 1) if re.search(r"FAIL|Error", l)]
          if len(hits) > 120:
              hits = hits[:60] + ["... %d more matching lines omitted ..." % (len(hits) - 120)] + hits[-60:]
          open(tail_dst, "w").write(redact("\n".join(lines[-80:])) + "\n")
          open(hits_dst, "w").write(redact("\n".join(hits)) + "\n" if hits else "")
          PY
          fi
          {
            echo "### SEO quality gate failed: failing step output (redacted)"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (run #$GITHUB_RUN_NUMBER), commit $GITHUB_SHA"
            if [ -s "$tail_file" ]; then
              echo "Log: $(basename "$log")"
              echo
              if [ -s "$hits_file" ]; then
                echo "#### Lines matching FAIL or Error (with line numbers)"
                echo
                echo '```'
                cat "$hits_file"
                echo '```'
                echo
              fi
              echo "#### Last 80 lines"
              echo
              echo '```'
              cat "$tail_file"
              echo '```'
            else
              echo
              echo "No captured step output (the failure happened before the first logged step)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # The annotation shows the first FAIL/Error lines when there are any, else the last lines of the log.
          if [ -s "$hits_file" ]; then
            msg=$(head -n 20 "$hits_file" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Failing step output: FAIL/Error lines ($(basename "$log"))::$msg"
          elif [ -s "$tail_file" ]; then
            msg=$(tail -n 20 "$tail_file" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Failing step output ($(basename "$log"))::$msg"
          fi

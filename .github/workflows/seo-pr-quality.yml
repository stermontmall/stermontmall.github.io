name: SEO pull request quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'seo-*.mjs'
      - 'generate-products.mjs'
      - 'kili-pages.js'
      - 'recent-orders.js'
      - 'product-content.json'
      - 'product-content.test.mjs'
      - 'data-health.mjs'
      - 'blog-write.mjs'
      - 'blog-build.mjs'
      - 'blog-topics.json'
      - 'blog/**'
      - 'p/**'
      - 'c/**'
      - 'guides/**'
      - 'services/**'
      - 'pest-control/**'
      - 'link-check.mjs'
      - 'mobile-shell/**'
      - '*.html'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      # Exercise the mobile shell with harmless fixtures, not live catalogue data.
      # Keep this check alongside the existing product and SEO quality gates.
      # Reset per-test tab state when asserting the default landing view.
      - name: Nothing may go through /classic.html (guard)
        run: node no-classic-hop.test.mjs
      - name: Run mobile shell browser regression suite
        run: python3 mobile-shell/shell.test.py
      - name: Broken and placeholder links (link-check.mjs)
        run: node link-check.mjs
      - name: Check JavaScript syntax
        run: |
          node --check seo-check.mjs
          node --check data-health.mjs
          node --check blog-write.mjs
          node --check generate-products.mjs
          node --check kili-pages.js
          node --check recent-orders.js
          node --check product-content.test.mjs
          node --check seo-meta.mjs
      - name: Test product category and safety enrichment
        run: node seo-product-extras.test.mjs
      - name: Test product and category SEO metadata
        run: node seo-meta.test.mjs
      - name: Test allowlisted ordinary-product meta descriptions
        run: node seo-safe-meta.test.mjs
      - name: Test safe consumer-guide meta descriptions
        run: node seo-safe-blog-meta.test.mjs
      - name: Test hand-written product content
        run: node product-content.test.mjs
      - name: Normalize blog titles and rebuild blog index and sitemap
        run: |
          node seo-blog-titles.mjs
          node blog-build.mjs
          node seo-safe-blog-meta.mjs
      - name: Build product and category pages from the live public catalogue
        run: node generate-products.mjs
      - name: Apply the same SEO enrichment passes used by production
        run: |
          node seo-kenya.mjs
          node seo-overrides.mjs
          node seo-titles.mjs
          node seo-safe-meta.mjs
          node seo-shell-redirect.mjs
      - name: Run full on-page SEO audit against production-equivalent generated pages
        run: node seo-check.mjs > seo-pr-report.md
      - name: Add audit summary
        if: always()
        run: |
          if [ -f seo-pr-report.md ]; then
            cat seo-pr-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seo-pr-audit-report
          path: seo-pr-report.md
          if-no-files-found: ignore

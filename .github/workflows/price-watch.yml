# Stermont Arcade - price watch. Compares product prices with competitor listings and opens a report issue.
# All scheduled runs are report-only. A manual run changes prices only when you explicitly tick "Apply price changes".
# Changes still require the SUPABASE_SERVICE_KEY repository secret and are limited by price-watch.config.json.
# Do not treat weak or single-source competitor matches as permission to change product prices.
name: Price watch

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Apply price changes (leave unchecked for report only)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the tests
        run: node --test price-watch.test.mjs
      - name: Check prices
        id: rep
        env:
          APPLY: ${{ inputs.apply_changes && '1' || '0' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node price-watch.mjs > price-watch.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-watch
          path: |
            price-watch.csv
            price-watch-backup.csv
          retention-days: 90
      - name: Open or refresh the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "Price watch in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded by the latest report." || true
          done
          if [ "${{ steps.rep.outputs.items }}" != "0" ]; then
            gh issue create --title "Price watch $(date +%F)" --body-file price-watch.md
          else
            echo "Prices are in line with the market - no issue needed."
          fi

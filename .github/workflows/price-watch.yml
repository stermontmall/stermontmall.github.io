# Stermont Arcade - price watch. Compares your prices with Jumia, Kilimall, Agroduka and ImagineCare, then fixes the ones that are
# clearly out of line: cuts prices that are well above the market and raises prices that are well under it (the safety limits are
# in price-watch.config.json). It opens a GitHub Issue (GitHub emails you) listing what changed or what could not be read.
# Runs every day at 08:00 Nairobi time, or whenever you tap "Run workflow" in the Actions tab.
# Changing prices needs the SUPABASE_SERVICE_KEY repository secret; without it the run is report-only.
# Tick "report only" on a manual run to look without changing anything.
name: Price watch

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Report only - do not change any prices'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the tests
        run: node --test price-watch.test.mjs
      - name: Check prices
        id: rep
        env:
          APPLY: ${{ inputs.report_only && '0' || '' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node price-watch.mjs > price-watch.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-watch
          path: |
            price-watch.csv
            price-watch-backup.csv
          retention-days: 90
      - name: Open or refresh the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "Price watch in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded by the latest report." || true
          done
          if [ "${{ steps.rep.outputs.items }}" != "0" ]; then
            gh issue create --title "Price watch $(date +%F)" --body-file price-watch.md
          else
            echo "Prices are in line with the market - no issue needed."
          fi

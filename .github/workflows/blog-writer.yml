# Stermont Arcade - drafts one new blog post every day from the next "pending" topic in blog-topics.json.
# Each draft is opened as a pull request and then MERGED AUTOMATICALLY, so the post goes live with no manual step.
# (To go back to manual review, delete the "Merge the pull request automatically" step and the one after it.)
# Needs the repository secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
# Also needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests" turned on.
# Runs: every day at 09:00 Nairobi time, or whenever you tap "Run workflow" in the Actions tab.
name: Blog writer

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      topic_slug:
        description: 'Optional: write this specific pending topic (slug from blog-topics.json)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: blog-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Draft the next post
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC_SLUG: ${{ github.event.inputs.topic_slug }}
        run: node blog-write.mjs

      - name: Open a pull request
        id: pr
        if: steps.draft.outputs.written == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.draft.outputs.slug }}
          TITLE: ${{ steps.draft.outputs.title }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          branch="draft/$SLUG"
          git checkout -b "$branch"
          git add "blog/$SLUG.html" blog-topics.json
          git commit -m "Draft blog post: $TITLE"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Blog post: $TITLE" \
            --body "Automatic post, merged automatically. To undo, revert the merge commit."
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Merge the pull request automatically
        if: steps.draft.outputs.written == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.branch }}" --squash --delete-branch

      # A merge made with the built-in token does not start the other workflows,
      # so start the blog index and sitemap rebuild by hand.
      - name: Rebuild blog index and sitemap
        if: steps.draft.outputs.written == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run blog-build.yml --ref main

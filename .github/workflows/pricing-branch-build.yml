name: Pricing review branch build

on:
  push:
    branches:
      - pricing/non-syngenta-market-review-20261117
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pricing-review-branch-build
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pricing review branch
        uses: actions/checkout@v7
        with:
          ref: pricing/non-syngenta-market-review-20261117
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run product SEO and generator tests
        run: |
          node category-hubs.test.mjs
          node seo-indexing-guard.test.mjs
          node seo-product-identifiers.test.mjs
          node seo-meta.test.mjs
          node seo-titles.test.mjs
          node seo-catalog-guard.test.mjs
          node seo-catalog-guard.mjs
          node seo-safe-meta.test.mjs
          node product-content.test.mjs
          node not-found-fallback.test.mjs
          node product-description-html.test.mjs
          node check-product-pages.test.mjs
          node home-grid-ssr.test.mjs

      - name: Build all product pages, category pages and product sitemap from Supabase
        run: node generate-products.mjs

      - name: Apply SEO title, description and layout passes
        run: |
          node seo-kenya.mjs || echo "seo-kenya pass reported a non-blocking issue"
          node seo-overrides.mjs
          node seo-titles.mjs || echo "seo-titles pass reported a non-blocking issue"
          node seo-safe-meta.mjs
          node seo-description-layout.mjs || echo "description-layout pass reported a non-blocking issue"
          node seo-related-fill.mjs || echo "related-fill pass reported a non-blocking issue"
          node seo-shell-redirect.mjs || echo "shell-redirect pass reported a non-blocking issue"

      - name: Confirm existing product page paths are preserved against main
        run: |
          git fetch origin main
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readdirSync } from 'node:fs';
          const main = execFileSync('git', ['ls-tree','-r','--name-only','origin/main','p'], {encoding:'utf8'}).trim().split('\n').filter(x => x.endsWith('.html'));
          const built = new Set(readdirSync('p').filter(x => x.endsWith('.html')).map(x => 'p/' + x));
          const missing = main.filter(x => !built.has(x));
          if (missing.length) {
            console.error('Existing product URLs missing from build:', missing.slice(0,50));
            process.exit(1);
          }
          console.log('Existing main product page paths preserved:', main.length);
          NODE

      - name: Verify all 205 prices, 25 pack offers, JSON-LD and sitemap lastmod
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const sqlFiles = readdirSync('supabase/sql').filter(x => /^pricing-batch-\d{3}\.sql$/.test(x)).sort();
          const updates = new Map(), newPacks = new Map();
          for (const file of sqlFiles) {
            const sql = readFileSync('supabase/sql/' + file, 'utf8');
            for (const m of sql.matchAll(/\('([^']+)',\s*[\d.]+::numeric,\s*([\d.]+)::numeric(?:,\s*[\d.]+::numeric)?\)/g)) {
              if (updates.has(m[1])) throw new Error('Duplicate updated product ID: ' + m[1]);
              updates.set(m[1], Number(m[2]));
            }
            for (const m of sql.matchAll(/update public\.products set price=([\d.]+),cost=[\d.]+\s+where id='([^']+)'[\s\S]{0,80}?and active=true and price=[\d.]+/gi)) {
              if (updates.has(m[2])) throw new Error('Duplicate updated product ID: ' + m[2]);
              updates.set(m[2], Number(m[1]));
            }
            for (const insert of sql.split(/insert into public\.products/i).slice(1)) {
              const rows = insert.split(/on conflict/i)[0];
              for (const m of rows.matchAll(/\('([^']+)',\s*\d+,\s*'[^']+',\s*([\d.]+)/g)) {
                if (newPacks.has(m[1])) throw new Error('Duplicate new pack ID: ' + m[1]);
                newPacks.set(m[1], Number(m[2]));
              }
            }
          }
          if (sqlFiles.length !== 18 || updates.size !== 205 || newPacks.size !== 25) {
            throw new Error(`Unexpected SQL scope: ${sqlFiles.length} files, ${updates.size} price updates, ${newPacks.size} pack inserts`);
          }
          const expected = new Map([...updates, ...newPacks]);
          const found = new Set(), canonicalBySku = new Map();
          const today = new Date().toISOString().slice(0,10);
          const d = new Date(); d.setFullYear(d.getFullYear() + 1);
          const expectedValidUntil = d.toISOString().slice(0,10);
          const sitemap = readFileSync('sitemap-products.xml','utf8');
          const sitemapEntries = new Map([...sitemap.matchAll(/<url>\s*<loc>([^<]+)<\/loc>\s*<lastmod>([^<]+)<\/lastmod>\s*<\/url>/g)].map(m => [m[1],m[2]]);
          const files = readdirSync('p').filter(x => x.endsWith('.html'));
          for (const file of files) {
            const html = readFileSync('p/' + file,'utf8');
            const canonical = html.match(/<link rel="canonical" href="([^"]+)"/i)?.[1];
            const scripts = [...html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/gi)];
            for (const script of scripts) {
              let root;
              try { root = JSON.parse(script[1]); } catch (e) { throw new Error('Invalid JSON-LD in p/' + file + ': ' + e.message); }
              const walk = value => {
                if (!value || typeof value !== 'object') return;
                if (Array.isArray(value)) { value.forEach(walk); return; }
                const sku = value.sku == null ? null : String(value.sku);
                if (sku && expected.has(sku) && value.offers) {
                  const offer = value.offers;
                  const price = expected.get(sku);
                  if (typeof offer.price !== 'number') throw new Error('Non-numeric JSON-LD price for ' + sku);
                  if (offer.price !== Math.round(price)) throw new Error('JSON-LD price mismatch for ' + sku + ': ' + offer.price + ' expected ' + price);
                  if (offer.priceCurrency !== 'KES') throw new Error('Wrong currency for ' + sku);
                  if (offer.availability !== 'https://schema.org/InStock') throw new Error('Expected InStock for ' + sku);
                  if (offer.priceValidUntil !== expectedValidUntil) throw new Error('Wrong priceValidUntil for ' + sku + ': ' + offer.priceValidUntil);
                  found.add(sku);
                  if (canonical) canonicalBySku.set(sku, canonical);
                }
                Object.values(value).forEach(walk);
              };
              walk(root);
            }
          }
          const missing = [...expected.keys()].filter(id => !found.has(id));
          if (missing.length) throw new Error('Missing product Offer JSON-LD for: ' + missing.join(', '));
          const missingSitemap = [...canonicalBySku.entries()].filter(([sku,url]) => sitemapEntries.get(url) !== today);
          if (missingSitemap.length) throw new Error('Missing or stale sitemap lastmod for product URLs: ' + missingSitemap.slice(0,30).map(x => x[0] + ' -> ' + x[1]).join(', '));
          console.log(`Verified ${updates.size} updated products + ${newPacks.size} new packs: numeric KES offers, InStock, one-year validity, valid JSON-LD, and sitemap lastmod ${today}.`);
          console.log('Product page files checked:', files.length, 'Sitemap product URLs:', sitemapEntries.size);
          NODE

      - name: Final product-page completeness guard
        run: node check-product-pages.mjs

      - name: Commit generated product pages and sitemap to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A p c guides sitemap-products.xml sitemap-state.json sitemap.xml robots.txt products.html merchant-feed.xml product-names.json index.html fashion.html cars-for-sale.html
          if ! git diff --cached --quiet; then
            git commit -m "Build pricing review product pages and sitemap"
            git push origin HEAD:pricing/non-syngenta-market-review-20261117
          else
            echo "No generated output changes to commit."
          fi
          test -z "$(git status --porcelain)"
          echo "Branch working tree clean."

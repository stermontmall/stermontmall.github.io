<!doctype html>
<html lang="en-KE">
<head>
<meta charset="utf-8">
<title>Stermont Arcade</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://stermontarcade.co.ke/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- /classic.html was the shop's old home page. It is now only a forwarder for old bookmarks and old shared links (about 1.5 KB, no shop code).
     The checkout lives on /checkout.html. A guard test (no-classic-hop.test.mjs) keeps this file tiny and keeps every page from linking here. -->
<script>
(function () {
  var l = location, t = '/';
  try {
    var q = new URLSearchParams(l.search);
    if (q.get('checkout') === '1') { t = '/checkout.html' + l.search + l.hash; }   /* an old cached shell still opening the checkout */
    else {
      var h = /^#p-([a-z0-9-]+)$/i.exec(l.hash || ''), it = q.get('item');         /* old shared product links: #p-<id> and ?item=<id> */
      q.delete('item');
      if (!q.has('product')) { if (h) q.set('product', h[1]); else if (it && /^[a-z0-9][a-z0-9-]*$/i.test(it)) q.set('product', it); }
      t = '/' + (q.toString() ? '?' + q.toString() : '') + (h ? '' : l.hash);
    }
  } catch (e) { t = '/'; }
  l.replace(t);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/"></noscript>
</head>
<body><p><a href="/">Open Stermont Arcade</a></p></body>
</html>

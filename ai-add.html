<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI Add Product · Stermont Arcade</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e4e7ec;--ac:#0b7a43;--er:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mut:#9aa4b2;--bd:#2a323d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit}
button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:600 16px system-ui;margin-top:14px}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.5}
#prev{max-width:100%;max-height:220px;border-radius:10px;margin-top:10px;display:none}
.msg{margin-top:12px;font-size:14px}.err{color:var(--er)}.ok{color:var(--ac)}.row{display:flex;gap:10px}.row>*{flex:1}
.hide{display:none}small{color:var(--mut)}
</style>
</head>
<body>
<h1>AI Add Product</h1>

<div class="card" id="login">
  <label>Staff email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button id="go">Sign in</button><div class="msg err" id="lerr"></div>
</div>

<div class="hide" id="app">
  <div class="card">
    <label>Product photo</label>
    <input id="photo" type="file" accept="image/*">
    <img id="prev" alt="">
    <label>Page with the price (optional link)</label>
    <input id="url" type="url" placeholder="https://www.jumia.co.ke/…">
    <div class="row">
      <div><label>Markup (× source price)</label><input id="mk" type="number" step="0.05" min="1" value="1.3"></div>
      <div><label>Or set price (KES)</label><input id="pr" type="number" min="1" placeholder="auto"></div>
    </div>
    <button id="run">Create draft product</button>
    <div class="msg" id="st"></div>
  </div>

  <div class="card hide" id="res">
    <b id="rn"></b>
    <p id="rd" style="font-size:14px"></p>
    <p><b id="rp"></b> <small id="rc"></small></p>
    <small id="rm"></small>
    <div class="row"><button id="pub">Publish</button><button class="sec" id="rst">Add another</button></div>
  </div>
  <button class="sec" id="out">Sign out</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const URL_ = "https://oewvtbnmyombbtggamor.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ld3Z0Ym5teW9tYmJ0Z2dhbW9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNjM1MTIsImV4cCI6MjEwNjgzOTUxMn0.KmUI7jWPgSVY4KvPR5S53dcvtbOD2QutljiBg52cAWw";
const sb = supabase.createClient(URL_, KEY);
const $ = id => document.getElementById(id);
let b64 = "", draftId = "";

function show(on){ $("login").classList.toggle("hide", on); $("app").classList.toggle("hide", !on); }
sb.auth.getSession().then(({data}) => show(!!data.session));
$("go").onclick = async () => {
  $("lerr").textContent = "";
  const {error} = await sb.auth.signInWithPassword({email:$("em").value.trim(), password:$("pw").value});
  if (error) $("lerr").textContent = error.message; else show(true);
};
$("out").onclick = async () => { await sb.auth.signOut(); show(false); };

// shrink the photo in the browser so it uploads fast on mobile data
function shrink(file){
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1400 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL("image/jpeg", .85);
      $("prev").src = d; $("prev").style.display = "block";
      ok(d.split(",")[1]);
    };
    img.onerror = () => bad(new Error("Could not read that image"));
    img.src = window.URL.createObjectURL(file);
  });
}
$("photo").onchange = async e => {
  const f = e.target.files[0]; b64 = "";
  if (f) try { b64 = await shrink(f); } catch (x) { $("st").textContent = x.message; $("st").className = "msg err"; }
};

function say(t, cls){ $("st").textContent = t; $("st").className = "msg " + (cls || ""); }

$("run").onclick = async () => {
  if (!b64) return say("Choose a product photo first.", "err");
  $("run").disabled = true; say("Reading photo and page… about 20 seconds");
  try {
    const {data:{session}} = await sb.auth.getSession();
    const r = await fetch(URL_ + "/functions/v1/ai-add-product", {
      method: "POST",
      headers: {"Content-Type":"application/json", apikey: KEY, Authorization: "Bearer " + session.access_token},
      body: JSON.stringify({image:b64, media_type:"image/jpeg", url:$("url").value.trim() || undefined, markup:+$("mk").value || 1.3, price:+$("pr").value || undefined})
    });
    const j = await r.json();
    if (!j.ok) {
      if (j.needs_price) { $("pr").focus(); return say(j.error + " Type a price above and press the button again.", "err"); }
      return say(j.error || "Something went wrong", "err");
    }
    const p = j.product; draftId = p.id;
    $("rn").textContent = p.name; $("rd").textContent = p.description;
    $("rp").textContent = "KES " + Number(p.price).toLocaleString();
    $("rc").textContent = p.cost ? "(cost " + Number(p.cost).toLocaleString() + ")" : "";
    $("rm").textContent = j.price_note + " " + j.page_note + " SEO: " + j.meta_description;
    $("res").classList.remove("hide"); say("Draft saved. Not on the shop until you publish.", "ok");
  } catch (e) { say(e.message, "err"); }
  $("run").disabled = false;
};

$("pub").onclick = async () => {
  const {error} = await sb.from("products").update({active:true}).eq("id", draftId);
  say(error ? error.message : "Published on the shop.", error ? "err" : "ok");
  if (!error) $("pub").disabled = true;
};
$("rst").onclick = () => { $("res").classList.add("hide"); $("photo").value = ""; $("url").value = ""; $("pr").value = ""; $("prev").style.display = "none"; b64 = ""; $("pub").disabled = false; say(""); };
</script>
</body>
</html>

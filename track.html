<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <title>Track your order | Stermont Arcade</title>
  <meta name="description" content="Track your Stermont Arcade order with your order number and phone number. No account needed.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root{--paper:#fff;--ink:#282828;--muted:#6b6b6b;--line:#e3e3e3;--panel:#f1f1f2;--card:#fff;--orange:#7c3aed;--navy:#2a0e5c;--gold:#c8f31d;--ok:#15803d;--bad:#d92d20}
    @media (prefers-color-scheme:dark){:root{--paper:#121212;--ink:#f1f1f1;--muted:#a8a8a8;--line:#2c2c2c;--panel:#1d1d1d;--card:#1d1d1d;--ok:#4ade80;--bad:#ff6b5e}}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;min-height:100vh}
    a{color:var(--orange)}
    :focus-visible{outline:3px solid var(--orange);outline-offset:2px}
    [hidden]{display:none!important}
    header{padding:.8rem 1rem;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:1rem;max-width:980px;margin:0 auto}
    .wm{font-size:1.4rem;font-weight:800;letter-spacing:-.04em;text-decoration:none;color:var(--ink)}
    .back{font-weight:600;text-decoration:none;color:var(--ink);font-size:.95rem}
    main{max-width:460px;margin:0 auto;padding:1.5rem 1rem 3rem}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.25rem;box-shadow:0 6px 24px rgba(91,33,182,.08)}
    h1{font-size:1.5rem;font-weight:800;line-height:1.2}
    .sub{color:var(--muted);margin:.3rem 0 1rem}
    .fld{margin:.75rem 0}
    .fld label{display:block;font-weight:700;font-size:.9rem;margin-bottom:.3rem}
    .fld input{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:2px solid transparent;border-radius:12px;padding:.75rem .9rem}
    .fld input:focus{outline:0;border-color:var(--orange);background:var(--paper)}
    .btn{width:100%;margin-top:.5rem;border:0;border-radius:999px;padding:.85rem;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,#9d5cff,#7c3aed);cursor:pointer}
    .btn:disabled{opacity:.6;cursor:wait}
    .err{color:var(--bad);font-weight:600;margin-top:.7rem}
    .res{margin-top:1.2rem;padding-top:1.1rem;border-top:1px solid var(--line)}
    .ref{font-weight:800;font-size:1.1rem}
    .when{color:var(--muted);font-size:.85rem}
    .pill{display:inline-block;margin:.6rem 0;padding:.25rem .75rem;border-radius:999px;font-weight:800;font-size:.8rem;background:var(--panel)}
    .pill.ok{color:var(--ok)}.pill.no{color:var(--bad)}
    .track{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin:.6rem 0 1rem}
    .stp{background:var(--panel);color:var(--muted);border-radius:10px;padding:.5rem .2rem;text-align:center;font-size:.75rem;font-weight:700}
    .stp.on{background:var(--orange);color:#fff}
    ul{list-style:none}
    li{display:flex;justify-content:space-between;gap:.8rem;padding:.4rem 0;border-top:1px solid var(--line);font-size:.92rem}
    li:first-child{border-top:0}
    .tot{display:flex;justify-content:space-between;font-weight:800;padding-top:.6rem;border-top:2px solid var(--line);margin-top:.3rem}
    .note{color:var(--muted);font-size:.88rem;margin-top:.8rem}
  </style>
</head>
<body>
  <header>
    <a class="wm" href="./">Stermont Arcade</a>
    <a class="back" href="./">&larr; Back to shop</a>
  </header>
  <main>
    <div class="card">
      <h1>Track your order</h1>
      <p class="sub">Enter your order number and the phone number you ordered with. No account needed.</p>
      <form id="f" novalidate>
        <div class="fld"><label for="ref">Order number</label><input id="ref" autocomplete="off" autocapitalize="characters" placeholder="STM-XXXXXX" maxlength="30"></div>
        <div class="fld"><label for="ph">Phone number</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="07XX XXX XXX" maxlength="20"></div>
        <button class="btn" id="go" type="submit">Track order</button>
        <p class="err" id="err" role="alert" hidden></p>
      </form>
      <div class="res" id="res" hidden></div>
    </div>
    <p class="note" style="text-align:center">Need help? <a id="wa" href="https://wa.me/254748888230" rel="noopener">Message us on WhatsApp</a>.</p>
  </main>
  <script>
  (function () {
    var SB = 'https://oewvtbnmyombbtggamor.supabase.co', KEY = 'sb_publishable_CQiZr-INuot9C4fbdJDz1Q_4OiWEQL7';
    var D = document, f = D.getElementById('f'), err = D.getElementById('err'), res = D.getElementById('res'), go = D.getElementById('go');
    function el(t, c, x) { var e = D.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
    function money(n) { return 'KSh ' + Math.round(Number(n) || 0).toLocaleString('en-KE'); }
    var STEPS = [['paid', 'Confirmed'], ['packed', 'Packed'], ['out_for_delivery', 'On the way'], ['delivered', 'Delivered']];
    var MSG = {
      pending: 'We received your M-Pesa code and are verifying your payment.',
      confirmed: 'Your payment is confirmed. We are preparing your order.',
      packed: 'Your order has been packed.',
      out_for_delivery: 'Your order is on the way. Keep your phone on.',
      delivered: 'Your order was delivered. Enjoy!',
      declined: 'We could not verify the payment, so the order was declined. Message us on WhatsApp.'
    };
    try { var q = new URLSearchParams(location.search).get('ref'); if (q) D.getElementById('ref').value = q.slice(0, 30); } catch (e) {}

    function show(o) {
      res.textContent = '';
      var paid = o.status === 'paid', key = o.status === 'declined' ? 'declined' : paid ? (o.stage || 'confirmed') : 'pending';
      var label = { pending: 'Pending verification', confirmed: 'Confirmed', packed: 'Packed', out_for_delivery: 'On the way', delivered: 'Delivered', declined: 'Declined' }[key];
      res.appendChild(el('div', 'ref', o.ref));
      res.appendChild(el('div', 'when', o.created_at ? new Date(o.created_at).toLocaleString('en-KE') : ''));
      res.appendChild(el('span', 'pill ' + (key === 'delivered' ? 'ok' : key === 'declined' ? 'no' : ''), label.toUpperCase()));
      if (paid) {
        var at = o.stage ? STEPS.findIndex(function (s) { return s[0] === o.stage; }) : 0, tr = el('div', 'track');
        STEPS.forEach(function (s, i) { tr.appendChild(el('div', 'stp' + (i <= at ? ' on' : ''), (i <= at ? '✓ ' : '') + s[1])); });
        res.appendChild(tr);
      }
      var ul = el('ul');
      (o.items || []).forEach(function (i) { var li = el('li'); li.appendChild(el('span', null, i.qty + ' × ' + i.name)); ul.appendChild(li); });
      res.appendChild(ul);
      var t = el('div', 'tot'); t.appendChild(el('span', null, 'Items total')); t.appendChild(el('span', null, money(o.subtotal))); res.appendChild(t);
      res.appendChild(el('div', 'note', (o.method === 'pickup' ? 'Collection order. ' : o.county ? 'Delivery to ' + o.county + '. ' : '') + MSG[key]));
      res.hidden = false;
    }

    f.addEventListener('submit', function (e) {
      e.preventDefault(); err.hidden = true; res.hidden = true;
      var ref = D.getElementById('ref').value.trim(), ph = D.getElementById('ph').value.trim();
      go.disabled = true; go.textContent = 'Checking...';
      fetch(SB + '/rest/v1/rpc/track_order', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ p_ref: ref, p_phone: ph }) })
        .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
        .then(function (d) { if (d && d.ok) show(d); else { err.textContent = (d && d.reason) || 'Could not find that order.'; err.hidden = false; } })
        .catch(function () { err.textContent = 'Could not check right now. Check your connection and try again.'; err.hidden = false; })
        .then(function () { go.disabled = false; go.textContent = 'Track order'; });
    });
  })();
  </script>
<script src="/analytics.js" defer></script></body>
</html>

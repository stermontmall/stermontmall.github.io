<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><title>Track Your Order | Stermont Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:620px;margin:auto;padding:26px 14px}.card{background:#fff;border:1px solid #e3e9f2;border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 4px 18px #15294b0a}h1{font-size:24px;margin:0 0 7px}p{line-height:1.5}.muted{color:#64748b;font-size:13px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:11px;background:#173b80;color:#fff;font-weight:800;font-size:15px;margin-top:14px}.err{color:#b91c1c;font-size:13px}.result{display:none}.pill{display:inline-block;border-radius:999px;background:#e0e7ff;color:#1e3a8a;padding:6px 10px;font-size:12px;font-weight:800}.line{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #edf0f5;padding:10px 0;font-size:14px}.line:last-child{border:0}.items{margin-top:10px}.link{color:#1d4ed8}
</style></head><body><main class="wrap"><p style="font-weight:800;letter-spacing:.03em">STERМONT ARCADE</p><h1>Track your order</h1><p class="muted">Enter the order reference and the phone number used at checkout.</p>
<section class="card"><form id="form"><label for="ref">Order reference</label><input id="ref" required placeholder="STM-XXXXXXXX" maxlength="30"><label for="phone">Phone number</label><input id="phone" required inputmode="tel" placeholder="07XX XXX XXX"><p id="error" class="err" role="alert"></p><button id="submit" class="btn">Find my order</button></form></section>
<section id="result" class="card result"><h2>Order <span id="order-ref"></span></h2><p><span id="status" class="pill"></span></p><div id="details"></div><h3>Items</h3><div id="items" class="items"></div><p class="muted">Payment is confirmed separately after staff verify the M-Pesa receipt. For help, <a class="link" href="https://wa.me/254789514060">contact us on WhatsApp</a>.</p></section><p class="muted"><a href="/" class="link">Return to Stermont Arcade</a></p></main>
<script>
(function(){'use strict';const API='https://ep-dry-butterfly-bhytt90y.apirest.c-10.eu-central-1.aws.neon.tech/stermont/rest/v1/';const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);$('ref').value=params.get('ref')||'';
$('form').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='';$('result').style.display='none';const ref=$('ref').value.trim(),phone=$('phone').value.trim();if(ref.length<3||phone.replace(/\D/g,'').length<9){$('error').textContent='Enter a valid order reference and phone number.';return}const b=$('submit');b.disabled=true;b.textContent='Checking…';try{const r=await fetch(API+'rpc/track_order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_ref:ref,p_phone:phone})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.reason||d.message||'We could not find an order with those details.');$('order-ref').textContent=d.ref;$('status').textContent=String(d.stage||d.status||'pending').replace(/[_-]/g,' ').toUpperCase();const details=[['Placed',d.created_at?new Date(d.created_at).toLocaleString('en-KE'):'—'],['Fulfilment',d.method==='pickup'?'Pickup':'Delivery'],['County',d.county||'—'],['Order total','KSh '+Number(d.subtotal||0).toLocaleString('en-KE')]];$('details').replaceChildren(...details.map(([k,v])=>{const el=document.createElement('div');el.className='line';const a=document.createElement('span'),z=document.createElement('b');a.textContent=k;z.textContent=v;el.append(a,z);return el}));$('items').replaceChildren(...(Array.isArray(d.items)?d.items:[]).map(i=>{const el=document.createElement('div');el.className='line';const a=document.createElement('span'),z=document.createElement('b');a.textContent=i.name||'Item';z.textContent='× '+(i.qty||1);el.append(a,z);return el}));$('result').style.display='block'}catch(err){$('error').textContent=err.message||'Tracking is temporarily unavailable.'}finally{b.disabled=false;b.textContent='Find my order'}})
})();
</script></body></html>
